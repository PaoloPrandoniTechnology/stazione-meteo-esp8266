; PlatformIO Project Configuration File
;
;   Target: Wemos D1 Mini (ESP8266)
;   Sensor: AS5600 (I2C, SDA=D2/GPIO4, SCL=D1/GPIO5)
;   Sample rate: 100 Hz (10 ms)
;   Output: seriale 115200 baud + pagina web (bussola aeronautica via WebSocket)
;
;   --- UPDATE OTA DUALE ---
;   A) Upload via Browser:  http://<ip-esp>/update
;   B) Upload via IDE/CLI:   pio run -t upload  (con upload_protocol = espota sotto)
;       * la prima volta devi flashare via USB; poi puoi usare questo OTA
;       * sostituire STAZIONE_METEO_IP con l'IP statico / hostname .local effettivo
;
[env:d1_mini]
platform      = espressif8266
board         = d1_mini
framework     = arduino
upload_speed  = 921600
monitor_speed = 115200
lib_compat_mode = strict
lib_deps =
    links2004/WebSockets@2.4.1
    adafruit/Adafruit BME280 Library@2.2.4
    adafruit/Adafruit Unified Sensor@1.1.14
    knolleary/PubSubClient@2.8
extra_scripts = extra_script.py
build_flags = -D MQTT_KEEPALIVE=30
